name: cal-private-v1

services:
  database:
    image: postgres:16-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
    environment:
      POSTGRES_USER: cal
      POSTGRES_DB: cal
      POSTGRES_PASSWORD: ${CAL_DEV_DATABASE_PASSWORD:?Set CAL_DEV_DATABASE_PASSWORD in .env}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - cal-database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cal -d cal"]
      interval: 5s
      timeout: 5s
      retries: 20

  mail:
    image: axllent/mailpit@sha256:aef2aacc11f075ec0fb6874275ee4a421e688e11a96ebb296134d1735c7761ce
    ports:
      - "127.0.0.1:11025:1025"
      - "127.0.0.1:18025:8025"

volumes:
  cal-database:
